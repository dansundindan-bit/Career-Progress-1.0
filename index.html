<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Progress</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Save Knappar -->

    <div class="save-area">
    <button onclick="exportSave()">Export Save</button>
    <button onclick="importSave()">Import Save</button>
    </div>

   
<!-- Spelområde -->
<div class="game-container">

    <!-- Vänster sida, Missions etc. -->
    <div class="panel left-panel">
        <h2>Jobs</h2>

        <div class="action-bar">
            <div id="action-progress"></div>
        </div>

        <div class="task">

            <div class="feed-row">
                <button id="feed-button" class="job-button" onclick="feed()" title="+2 hunger">Feed</button>
                <button id="cry-button" class="job-button" onclick="cryForFood()" title="Increases Hunger gained from Feed by +0.5">Cry for food</button>
            </div>       
        </div>

        
    </div>   

    <!-- Höger sida, Statistics -->
    <div class="panel right-panel">

        <h2>Statistics</h2>

        <div id="progression-message"></div>  

        <h3 id="lifetime">Day: 0</h3>

        <div class="day-row">
            <div class="day-bar">
                <div id="day-progress"></div>
            </div>
            <div id="day-percent">0%</div>
            <div id="day-time">14:24</div>
        </div>             
        <br>
        <br>

        <div id="money">Money: 0</div>
        <br>


        <div class="hunger-row">
            <div class="stat-bar">
                <div id="hunger-progress"></div>
            </div>
            <div id="hunger-percent">50%</div>
            <div id="hunger-time">14:24</div>            
        </div>
    <div id="feed-uses">Feed uses: 0</div> 
    
    </div>

    <!-- Logg panelen -->
    <div class="panel log-panel">
    <h2>Logg</h2>

    <div id="event-log"></div>
    </div>


    <!-- Achievements panelen -->
    <div class="panel achievements-panel">
    <h2>Achievements</h2>

    <div class="achievement-item">
        <button class="achievement-button" id="achievement-feed">Feed</button>
    </div>

    <div class="achievement-item">
        <button class="achievement-button" id="achievement-well-fed">Well fed</button>
    </div>
</div>


    
<div id="death-screen">
    <div>YOU DIED</div>
</div>


    <script src="game.js"></script>
    <script src="hunger.js"></script>
    <script src="progression.js"></script>
    <script src="achievements.js"></script>
    <script src="shop.js"></script>  
    <script src="ui.js"></script>
    <script src="time.js"></script>
    <script src="hunger.js"></script>    
    <script src="jobs.js"></script>    
    <script src="save.js"></script>


</div>

</body>
</html>
